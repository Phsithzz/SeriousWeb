openapi: 3.0.3
info:
  title: Adidus API
  version: 2.0.0
  description: REST API for the Adidus storefront. Authentication uses an HttpOnly session cookie.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    Profile:
      type: object
      required: [name, lastname, email]
      properties:
        name: { type: string, maxLength: 100 }
        lastname: { type: string, maxLength: 100 }
        email: { type: string, format: email }
    CartItemInput:
      type: object
      required: [variant_id, quantity]
      properties:
        variant_id: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 20 }
    Address:
      type: object
      required: [house_number, village_number, subdistrict, district, province, postal_code]
      properties:
        house_number: { type: string }
        village_number: { type: string }
        subdistrict: { type: string }
        district: { type: string }
        province: { type: string }
        postal_code: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Admin access required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /health:
    get:
      summary: Database-backed health check
      responses:
        '200': { description: Healthy }
        '500': { description: Unhealthy }
  /user/register:
    post:
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Profile'
                - type: object
                  required: [password]
                  properties:
                    password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: Registered }
        '400': { description: Invalid input }
        '409': { description: Email exists }
  /user/login:
    post:
      summary: Start a cookie session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200': { description: Logged in; sets the token cookie }
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts }
  /user/logout:
    post:
      summary: Clear the session cookie
      responses:
        '200': { description: Logged out }
  /user/info:
    get:
      summary: Read the current session
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /user/me:
    get:
      summary: Read the current profile
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Update the current profile
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Profile' }
      responses:
        '200': { description: Updated and session refreshed }
        '409': { description: Email exists }
  /user/me/password:
    put:
      summary: Change the current password
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid password }
  /user/me/avatar:
    post:
      summary: Upload one JPEG avatar (maximum 5 MB)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Uploaded }
        '400': { description: Invalid upload }
  /products:
    get:
      summary: List products
      responses:
        '200': { description: Product list }
  /products/{id}:
    get:
      summary: Read a product and its variants
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Product }
        '404': { description: Product not found }
    delete:
      summary: Delete a product (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/search:
    get:
      summary: Search products
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
      responses:
        '200': { description: Search results }
  /products/admin:
    get:
      summary: List products (admin)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Product list }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a product with one JPEG image (admin)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, description, price, stock_quantity, brand, category_name, detail, image]
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                stock_quantity: { type: integer }
                brand: { type: string }
                category_name: { type: string }
                detail: { type: string }
                image: { type: string, format: binary }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/admin/{productId}:
    put:
      summary: Update a product (admin)
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
  /cart:
    get:
      summary: List the current user's active cart
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Cart items }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cart/items:
    post:
      summary: Add an item using the server-side variant price
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemInput' }
      responses:
        '201': { description: Added }
        '400': { description: Invalid item or insufficient stock }
  /cart/items/{cartId}:
    put:
      summary: Change quantity on the current user's cart item
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Updated }
    delete:
      summary: Remove the current user's cart item
      security: [{ cookieAuth: [] }]
      parameters:
        - in: path
          name: cartId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted }
  /cart/checkout:
    post:
      summary: Atomically create an order and decrement locked stock
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, payment_method]
              properties:
                address: { $ref: '#/components/schemas/Address' }
                payment_method: { type: string }
      responses:
        '200': { description: Order created }
        '409': { description: Insufficient stock }
  /cart/orders:
    get:
      summary: List the current user's order items
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Order items }
  /variant:
    get:
      summary: List variants (admin)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Variant list }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a variant and synchronize product stock (admin)
      security: [{ cookieAuth: [] }]
      responses:
        '201': { description: Created }
  /order/admin:
    get:
      summary: List orders (admin)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Order list }
        '403': { $ref: '#/components/responses/Forbidden' }
